services:
  - type: web
    name: growth-dashboards
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Clave para firmar sesiones y códigos OTP. Valor largo y aleatorio.
      - key: SECRET_KEY
        sync: false
      # Correos con acceso, separados por coma. Amplía la lista aquí
      # (sin tocar código): Render reinicia el servicio al guardarla.
      - key: ALLOWED_EMAILS
        sync: false
      # Envío de códigos por la API de Brevo (HTTPS). Es la vía que
      # funciona en Render, que bloquea los puertos SMTP salientes.
      # SMTP_FROM = remitente verificado en Brevo.
      - key: BREVO_API_KEY
        sync: false
      # SMTP clásico: solo para hosts que permiten SMTP saliente.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Correos con acceso al panel de administración (/admin).
      - key: ADMIN_EMAILS
        sync: false
      # Origen de los datos: local | carpeta | dropbox | github
      # Recomendado: github, con un repo privado que tenga una carpeta por
      # proyecto. Da la fecha real de subida por archivo y evita redeploys.
      - key: DATA_ORIGEN
        sync: false
      - key: DATA_REPO
        sync: false
      - key: DATA_TOKEN
        sync: false
      - key: DATA_RAMA
        sync: false
      - key: DATA_PREFIJO
        sync: false
      # Solo para DATA_ORIGEN=carpeta (disco persistente o unidad de red).
      - key: DATA_CARPETA
        sync: false
      # Solo para DATA_ORIGEN=dropbox.
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DATA_CARPETA_DROPBOX
        sync: false
